<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sanctuary Of Reed</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b1929">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sanctuary">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import {
    getAuth, signInWithEmailAndPassword, signInAnonymously,
    onAuthStateChanged, browserLocalPersistence, setPersistence,
  } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import {
    getFirestore, collection, addDoc, getDocs, doc, deleteDoc,
    updateDoc, setDoc, getDoc, onSnapshot, query, orderBy,
    serverTimestamp, Timestamp,
  } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  // ★ 三個 App 共用同一個 Firebase 專案
  const firebaseConfig = {
    apiKey:            'AIzaSyD0S4gVD5OHiztOaL6JRMmWA0grH8NkOxU',
    authDomain:        'auroraenvoy.firebaseapp.com',
    projectId:         'auroraenvoy',
    storageBucket:     'auroraenvoy.firebasestorage.app',
    messagingSenderId: '456319814884',
    appId:             '1:456319814884:web:06b046a8a1667d25ceb0f1',
  };

  const APP_ROOT = 'SanctuaryOfReed';
  const ENTRIES_PATH = 'SanctuaryOfReed';   // 日記集合路徑

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  window._fb = {
    auth, db, collection, addDoc, getDocs, doc, deleteDoc,
    updateDoc, setDoc, getDoc, onSnapshot, query, orderBy,
    serverTimestamp, Timestamp,
    ENTRIES_PATH,
  };

  // Owner 登入（Email/Password）
  window._fbSignInOwner = async (email, password) => {
    await setPersistence(auth, browserLocalPersistence);
    return signInWithEmailAndPassword(auth, email, password);
  };

  // 即時監聽訪客通行證
  let _guestUnsubscribe = null;
  window._fbStartGuestWatch = (guestUid) => {
    if (_guestUnsubscribe) _guestUnsubscribe();
    const ref = doc(db, 'guest_access', guestUid);
    _guestUnsubscribe = onSnapshot(ref, (snap) => {
      if (!snap.exists()) { if (_guestUnsubscribe) { _guestUnsubscribe(); _guestUnsubscribe = null; } window._showGuestScreen(); return; }
      const raw = snap.data().expiresAt;
      const expiresAtMs = typeof raw === 'number' ? raw : (raw?.toMillis?.() ?? 0);
      if (Date.now() > expiresAtMs) {
        if (_guestUnsubscribe) { _guestUnsubscribe(); _guestUnsubscribe = null; }
        window._showGuestScreen();
      }
    }, () => {
      window._showGuestScreen();
    });
  };

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      // 未登入 → 匿名登入，等待 OTP 驗證
      await signInAnonymously(auth).catch(e => {
        document.getElementById('screen-loading').innerHTML =
          '<p style="color:#c44;font-size:13px">Firebase 連線失敗：' + e.message + '</p>';
      });
      return;
    }
    window._me = user;
    document.querySelectorAll('.display-uid').forEach(el => el.textContent = user.uid);

    if (!user.isAnonymous) {
      // Owner（Email 登入）
      window.enterApp('trusted');
    } else {
      // 匿名用戶：檢查是否有有效的 guest_access
      try {
        const gd = await getDoc(doc(db, 'guest_access', user.uid));
        if (gd.exists()) {
          const raw = gd.data().expiresAt;
          const expiresAtMs = typeof raw === 'number' ? raw : (raw?.toMillis?.() ?? 0);
          if (expiresAtMs > Date.now()) {
            window._fbOwnerUid = gd.data().ownerUid;
            window.enterApp('guest');
            window._fbStartGuestWatch(user.uid);
            return;
          }
        }
      } catch(_) {}
      document.getElementById('screen-loading').style.display = 'none';
      document.getElementById('screen-guest').style.display = 'flex';
    }
  });
</script>

<style>
/* ═══════════════════════════════════════
   VARIABLES
═══════════════════════════════════════ */
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  /* Gold — used sparingly as accent */
  --gold:#c4a24a; --gold-mid:#b08c36; --gold-deep:#8c6e22;
  --gold-light:#ddb96a; --gold-pale:#f0e0b0; --gold-faint:#faf5e8; --gold-bg:#f5edd5;

  /* Navy — header, selected states, buttons */
  --navy:#0b1929; --navy-mid:#122238; --navy-light:#1a3050; --navy-soft:#243d68;

  /* Blue — body text */
  --blue-text:#1c304e; --blue-mid:#284268; --blue-soft:#4a6284; --blue-faint:#8898b8;

  /* Surfaces — white-dominant */
  --white:#ffffff; --off-white:#fbfaf8; --sidebar-bg:#f7f4ec;
  --border-g:rgba(180,148,60,0.20); --border-b:rgba(28,48,78,0.08);
  --radius:3px;
  --shadow:0 4px 40px rgba(11,25,41,0.10);
}

body { font-family:'Noto Sans TC',sans-serif; background:var(--white); color:var(--blue-text); height:100svh; overflow:hidden; transition:filter 0.5s ease; }

/* ═══════════════════════════════════════
   STEALTH MODE
   Strategy: two-layer approach.
   1. body filter: sepia+brightness flattens mid-tones to warm paper.
   2. Direct color overrides on high-contrast elements (dark backgrounds,
      dark text, borders) so nothing stands out at camera distance.
   Near-screen (~55cm): faint warm text still legible.
   Camera / oblique: uniform blank cream page.
═══════════════════════════════════════ */
body.stealth {
  filter: sepia(1) brightness(1.08) contrast(0.38) saturate(0);
}

/* Override all dark-background elements to near-paper */
body.stealth .sb-head,
body.stealth .btn-new,
body.stealth .btn-save,
body.stealth .btn-main,
body.stealth .mob-btn-new,
body.stealth .mob-btn-save,
body.stealth .cal-day.selected,
body.stealth .mob-cal-day.selected,
body.stealth .stealth-btn,
body.stealth .role-badge,
body.stealth .en-tts-btn,
body.stealth .mob-split-tts-btn {
  background: rgba(210,195,160,0.18) !important;
  color: rgba(120,105,70,0.55) !important;
  border-color: rgba(180,160,110,0.15) !important;
  box-shadow: none !important;
}

/* Borders and dividers — near invisible */
body.stealth * {
  border-color: rgba(190,175,135,0.12) !important;
  box-shadow: none !important;
}

/* Text in all elements */
body.stealth,
body.stealth * {
  color: rgba(80,68,40,0.88) !important;
  text-shadow: none !important;
}

/* Backgrounds that were white/off-white stay paper-like via filter,
   but sidebar was gold-tinted — flatten it */
body.stealth .sidebar,
body.stealth .ed-header,
body.stealth .ed-toolbar,
body.stealth .statusbar,
body.stealth .calendar-wrap,
body.stealth .cal-new-row,
body.stealth .sb-spacer {
  background: rgba(235,225,200,0.25) !important;
}

/* Kill text selection highlight */
body.stealth ::selection { background: rgba(180,160,100,0.10); color: inherit; }
body.stealth ::-moz-selection { background: rgba(180,160,100,0.10); color: inherit; }

/* Loading */
#screen-loading { display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:14px; color:var(--blue-faint); font-size:13px; }
.spinner { width:26px; height:26px; border:2px solid var(--border-g); border-top-color:var(--gold); border-radius:50%; animation:spin .9s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ═══════════════════════════════════════
   GUEST SCREEN
═══════════════════════════════════════ */
#screen-guest { display:none; align-items:center; justify-content:center; min-height:100vh; }
.auth-card { background:var(--white); border:1px solid var(--border-g); border-radius:var(--radius); padding:48px 44px 40px; width:min(420px,92vw); box-shadow:var(--shadow); position:relative; overflow:hidden; }
.auth-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--gold-deep),var(--gold-light),var(--gold-deep)); }
.brand { text-align:center; margin-bottom:36px; }
.brand .ico { font-size:28px; display:block; margin-bottom:10px; color:var(--gold); }
.brand h1 { font-family:'Cormorant Garamond',serif; font-size:26px; letter-spacing:6px; color:var(--navy); font-weight:600; }
.brand p { font-size:11px; color:var(--blue-soft); margin-top:7px; letter-spacing:1px; }
.code-inputs { display:flex; gap:8px; justify-content:center; margin:24px 0; }
.code-inputs input { width:46px; height:56px; border:1px solid var(--border-g); border-radius:var(--radius); text-align:center; font-size:22px; font-weight:500; color:var(--navy); background:var(--gold-faint); outline:none; transition:all .2s; font-family:'Noto Serif TC',serif; }
.code-inputs input:focus { border-color:var(--gold); background:var(--white); box-shadow:0 0 0 3px rgba(201,168,76,0.12); }
.code-inputs input.filled { border-color:var(--gold-mid); }
.code-inputs input.err { border-color:#b04040; animation:shake .3s; }
/* ⚠️ 視覺假格：搭配單一隱藏 input 使用，請勿改回多 input 設計（見 HTML 註解） */
.code-cell { width:46px; height:56px; border:1px solid var(--border-g); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:500; color:var(--navy); background:var(--gold-faint); font-family:'Noto Serif TC',serif; transition:all .2s; cursor:text; user-select:none; }
.code-cell.active { border-color:var(--gold); background:var(--white); box-shadow:0 0 0 3px rgba(201,168,76,0.12); }
.code-cell.filled { border-color:var(--gold-mid); }
.code-cell.err { border-color:#b04040; animation:shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.btn-main { width:100%; padding:13px; background:var(--navy); color:var(--gold-light); border:none; border-radius:var(--radius); font-size:13px; font-weight:600; letter-spacing:3px; cursor:pointer; font-family:'Noto Sans TC',sans-serif; transition:all .2s; }
.btn-main:hover { background:var(--navy-light); }
.btn-main:disabled { opacity:0.4; cursor:default; }
.err-msg { font-size:11px; color:#b04040; text-align:center; margin-top:10px; min-height:16px; }
.uid-hint { margin-top:20px; padding:10px 12px; background:var(--gold-faint); border:1px solid var(--border-g); border-radius:var(--radius); font-size:10px; color:var(--blue-soft); line-height:1.8; }
.uid-hint code { font-family:monospace; font-size:10px; color:var(--blue-mid); word-break:break-all; }

/* ═══════════════════════════════════════
   PC APP LAYOUT  (editor LEFT, sidebar RIGHT)
═══════════════════════════════════════ */
#screen-app { display:none; height:100vh; flex-direction:row; overflow:hidden; }

/* ── EDITOR (left) ── */
.editor { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--white); position:relative; }
.editor::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(196,162,74,.025) 32px); pointer-events:none; z-index:0; }

/* Editor header — sync icon LEFT of title */
.ed-header { display:flex; align-items:center; padding:13px 28px; border-bottom:1px solid var(--border-g); background:var(--white); position:relative; z-index:1; gap:10px; }
.sync-icon { font-size:13px; color:transparent; transition:color .3s; flex-shrink:0; user-select:none; }
.sync-icon.syncing { color:var(--gold); animation:syncpulse 0.8s ease-in-out infinite alternate; }
.sync-icon.error { color:#c44; animation:none; }
@keyframes syncpulse { from{opacity:0.3} to{opacity:1} }
.ed-header-title { font-family:'Cormorant Garamond',serif; font-size:16px; letter-spacing:4px; color:var(--blue-text); font-weight:600; flex:1; }

.ed-toolbar { display:flex; align-items:center; justify-content:space-between; padding:9px 28px; border-bottom:1px solid var(--border-g); background:var(--white); position:relative; z-index:1; }
.tr { display:flex; gap:7px; align-items:center; }
.btn-del { padding:5px 12px; background:none; border:1px solid var(--border-b); border-radius:var(--radius); font-size:11px; color:var(--blue-soft); cursor:pointer; transition:all .2s; }
.btn-del:hover { border-color:#b04040; color:#b04040; }
.btn-save { padding:6px 20px; background:linear-gradient(135deg,var(--navy-mid),var(--navy-light)); color:var(--gold-light); border:none; border-radius:var(--radius); font-size:12px; letter-spacing:2px; cursor:pointer; font-family:'Noto Sans TC',sans-serif; transition:all .2s; font-weight:600; }
.btn-save:hover { background:linear-gradient(135deg,var(--navy-light),var(--navy-soft)); }
.btn-save:disabled { opacity:.4; cursor:default; }

#entry-date { font-size:10px; color:var(--gold-mid); letter-spacing:2.5px; margin-bottom:16px; font-weight:500; }
#entry-body { font-family:'Noto Serif TC',serif; font-size:15px; line-height:2.1; color:var(--blue-text); border:none; outline:none; width:100%; flex:1; min-height:300px; background:transparent; resize:none; }
#entry-body::placeholder { color:rgba(74,98,132,.18); }

.welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; z-index:1; padding:40px; }
.welcome-icon { font-size:28px; color:var(--gold); opacity:.35; margin-bottom:18px; }
.welcome h3 { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; margin-bottom:8px; color:var(--blue-text); letter-spacing:4px; }
.welcome p { font-size:12px; line-height:1.9; color:var(--blue-faint); }

.statusbar { padding:5px 28px; border-top:1px solid var(--border-g); font-size:10px; color:var(--blue-faint); background:var(--off-white); z-index:1; display:flex; align-items:center; gap:7px; }
.sdot { width:5px; height:5px; border-radius:50%; background:#4aaa70; flex-shrink:0; }

/* ── SIDEBAR (right) ── */
.sidebar { width:280px; min-width:240px; background:var(--white); border-left:1px solid var(--border-g); display:flex; flex-direction:column; order:1; }

.sb-head { padding:14px 16px 12px; border-bottom:1px solid rgba(11,25,41,0.18); background:var(--navy); }
.sb-head-row { display:flex; align-items:center; justify-content:space-between; }
.sb-title { font-family:'Cormorant Garamond',serif; font-size:17px; letter-spacing:4px; color:var(--gold-light); font-weight:600; }

/* Stealth btn */
.stealth-btn { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:20px; padding:4px 10px; cursor:pointer; font-size:10px; color:rgba(255,255,255,0.55); letter-spacing:1px; transition:all .25s; font-family:'Noto Sans TC',sans-serif; }
.stealth-btn:hover { background:rgba(255,255,255,0.15); color:rgba(255,255,255,0.8); }
.stealth-btn.active { background:rgba(196,162,74,0.15); border-color:rgba(196,162,74,0.35); color:var(--gold-light); }

.role-badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:2px 8px; border-radius:20px; margin-top:5px; font-weight:500; }
.role-badge.trusted { background:rgba(196,162,74,.18); color:var(--gold-light); }
.role-badge.guest { background:rgba(255,255,255,.08); color:rgba(255,255,255,.5); }
.role-badge.guest:hover { background:rgba(180,60,60,.25); color:rgba(255,180,180,.85); }

/* Calendar */
.calendar-wrap { padding:14px 13px 10px; background:var(--white); flex-shrink:0; }
.cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.cal-month { font-family:'Cormorant Garamond',serif; font-size:14px; font-weight:600; color:var(--blue-text); letter-spacing:2px; }
.cal-arrow { background:none; border:none; color:var(--gold-mid); font-size:18px; cursor:pointer; padding:0 4px; transition:color .15s; line-height:1; }
.cal-arrow:hover { color:var(--navy); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-dow { text-align:center; font-size:9px; color:var(--blue-faint); padding:1px 0 4px; }
.cal-day { text-align:center; font-size:11px; border-radius:var(--radius); cursor:pointer; color:var(--blue-mid); transition:all .15s; aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative; }
.cal-day:empty { cursor:default; }
.cal-day:not(:empty):hover { background:var(--gold-faint); color:var(--navy); }
.cal-day.today { font-weight:700; color:var(--navy-mid); }
.cal-day.today::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:3px; height:3px; border-radius:50%; background:var(--gold); }
.cal-day.has-entry::before { content:''; position:absolute; bottom:1px; left:50%; transform:translateX(-50%); width:12px; height:2px; border-radius:1px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); }
.cal-day.selected { background:var(--navy) !important; color:var(--gold-light) !important; font-weight:700; }
.cal-day.selected::before, .cal-day.selected::after { display:none !important; }

/* Divider line under calendar */
.cal-divider { height:1px; background:var(--border-g); margin:0 13px; }

/* Energy bar */

/* Spacer pushes btn-new to bottom */
.sb-spacer { flex:1; }

/* New entry btn at bottom */
.cal-new-row { padding:12px 13px; border-top:1px solid var(--border-g); background:var(--white); display:flex; gap:7px; flex-shrink:0; }
.btn-new { flex:1; padding:10px; background:var(--navy); color:var(--gold-light); border:none; border-radius:var(--radius); font-size:12px; cursor:pointer; letter-spacing:2px; font-family:'Noto Sans TC',sans-serif; transition:all .2s; font-weight:500; }
.btn-new:hover { background:var(--navy-light); }
.btn-gen { display:none; align-items:center; justify-content:center; padding:10px 12px; background:none; border:1px solid var(--border-g); border-radius:var(--radius); font-size:12px; color:var(--blue-mid); cursor:pointer; transition:all .2s; text-align:center; }
.btn-gen:hover { background:var(--gold-faint); }
/* ── HOVER TOOLTIP ── */
.cal-tooltip { position:fixed; background:var(--navy); color:var(--gold-light); border-radius:4px; padding:6px 10px; font-size:11px; pointer-events:none; z-index:9999; white-space:nowrap; opacity:0; transition:opacity .15s; line-height:1.7; border:1px solid rgba(201,168,76,0.25); }
.cal-tooltip.show { opacity:1; }
.tt-pos { color:var(--gold-light); }
.tt-neg { color:#7ea8e0; }

/* ── TOKEN MODAL ── */
.modal-wrap { display:none; position:fixed; inset:0; background:rgba(13,27,46,.5); z-index:200; align-items:center; justify-content:center; backdrop-filter:blur(3px); }
.modal-wrap.open { display:flex; }
.modal { background:var(--white); border-radius:var(--radius); padding:36px 40px; width:min(380px,92vw); border:1px solid var(--border-g); box-shadow:var(--shadow); position:relative; overflow:hidden; }
.modal::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--gold-deep),var(--gold-light),var(--gold-deep)); }
.modal h3 { font-family:'Cormorant Garamond',serif; font-size:18px; margin-bottom:6px; color:var(--navy); letter-spacing:2px; }
.modal .sub { font-size:11px; color:var(--blue-soft); line-height:1.8; margin-bottom:20px; }
.dur-row { display:flex; gap:7px; margin-bottom:20px; }
.dur-btn { flex:1; padding:8px; border:1px solid var(--border-g); background:none; border-radius:var(--radius); font-size:11px; cursor:pointer; transition:all .15s; font-family:'Noto Sans TC',sans-serif; color:var(--blue-soft); }
.dur-btn:hover { border-color:var(--gold); }
.dur-btn.active { background:var(--navy); color:var(--gold-light); border-color:var(--navy-mid); font-weight:600; }
.token-box { text-align:center; padding:24px; background:var(--gold-faint); border-radius:var(--radius); border:1px dashed var(--border-g); margin-bottom:16px; }
.token-num { font-family:'Cormorant Garamond',serif; font-size:42px; font-weight:600; letter-spacing:12px; color:var(--navy); }
.token-num.empty { color:rgba(11,25,41,.14); }
.token-tim { font-size:11px; color:var(--blue-soft); margin-top:7px; }
.token-tim span { color:var(--gold-deep); font-weight:600; }
.btn-outline { width:100%; padding:10px; background:none; border:1px solid var(--border-g); border-radius:var(--radius); font-size:12px; cursor:pointer; font-family:'Noto Sans TC',sans-serif; color:var(--blue-soft); transition:all .2s; margin-top:7px; letter-spacing:1px; }
.btn-outline:hover { background:var(--gold-faint); border-color:var(--gold); color:var(--navy); }

/* ── COMPARE BUTTON ── */

/* ── COMPARE (dual-column) VIEW ── */
.compare-view {
  flex:1; display:flex; flex-direction:row; overflow:hidden;
  background:var(--white); position:relative; z-index:1;
}
.compare-col {
  flex:1; display:flex; flex-direction:column;
  padding:24px 32px; overflow-y:auto;
}
.compare-col::-webkit-scrollbar { width:3px; }
.compare-col::-webkit-scrollbar-thumb { background:var(--border-g); }
.compare-pos { background:linear-gradient(180deg,rgba(196,162,74,0.07) 0%,transparent 60%); }
.compare-label {
  font-size:10px; letter-spacing:2.5px; font-weight:600;
  margin-bottom:8px; opacity:.55;
}
.compare-pos .compare-label { color:var(--gold-deep); }
.compare-date {
  font-size:9.5px; color:var(--gold-mid); letter-spacing:2px;
  margin-bottom:14px; font-weight:500;
}

<script>
/* ═══════════════════════ SHARED STATE ═══════════════════════ */
let curId = null, mood = '', entries = [], durMin = 30, timerInt = null;
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
let mobCalYear = new Date().getFullYear(), mobCalMonth = new Date().getMonth();

let mobCurId = null, mobMood = '', mobAutoSaveTimer = null;


/* ═══════════════════════ SYNC ICON ═══════════════════════ */
function setSyncState(state) {
  // state: 'idle' | 'syncing' | 'error'
  ['sync-icon','mob-sync-icon'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = id.replace('-icon','') + (id.startsWith('mob') ? '-icon' : ' sync-icon');
    if (state === 'syncing') { el.className += ' syncing'; el.style.color = ''; }
    else if (state === 'error') { el.className += ' error'; el.style.color = ''; }
    else { el.style.color = 'transparent'; }
  });
  // re-apply proper class names (simpler):
  const pc = document.getElementById('sync-icon');
  const mob = document.getElementById('mob-sync-icon');
  if (pc) pc.className = state === 'syncing' ? 'sync-icon syncing' : state === 'error' ? 'sync-icon error' : 'sync-icon';
  if (mob) mob.className = state === 'syncing' ? 'mob-sync-icon syncing' : state === 'error' ? 'mob-sync-icon error' : 'mob-sync-icon';
}

/* ═══════════════════════ AUTH ═══════════════════════ */
/*
 * ⚠️ 驗證碼輸入區架構說明（重要，修改前必讀）
 * ────────────────────────────────────────────────
 * 【為什麼不用多個 input？】
 * 每格一個 input 的設計看似直覺，但有根本性問題：
 *   - 桌機：keydown 的 e.preventDefault() 在部分瀏覽器無法阻止 input 事件，
 *     導致 keydown + input 各執行一次 → 一個數字填兩格。
 *   - iOS / Android：數字鍵盤走 composition 流程，一次輸入觸發多次 input。
 *   - focus() 跳格時，新獲焦點的 input 也可能觸發 input 事件。
 * 以上問題交織在一起，無法用 flag 完全防堵，每次修改都會讓 bug 復發。
 *
 * 【現在的架構：單一隱藏 input + 視覺假格】
 * - 一個透明 input 鋪滿整個 .code-inputs 區域，接收所有鍵盤輸入
 * - 六個 .code-cell div 純粹負責顯示，不接收輸入
 * - input 事件只會觸發一次，不存在跳格、雙填問題
 * - 支援貼上、手機數字鍵盤、autocomplete="one-time-code"
 *
 * 請勿改回多 input 設計。
 */
function setupOtpInput(realInputId, cellsId, btnId, onComplete) {
  const realInput = document.getElementById(realInputId);
  const cells = [...document.getElementById(cellsId).querySelectorAll('.code-cell')];

  function render(val, hasFocus) {
    cells.forEach((cell, i) => {
      cell.textContent = val[i] || '';
      cell.classList.toggle('filled', !!val[i]);
      cell.classList.remove('active');
    });
    if (hasFocus) {
      const activeIdx = Math.min(val.length, cells.length - 1);
      cells[activeIdx].classList.add('active');
    }
  }

  realInput.addEventListener('input', () => {
    // 只保留數字，最多6位
    const digits = realInput.value.replace(/\D/g, '').slice(0, 6);
    realInput.value = digits;
    render(digits, true);
    const btn = document.getElementById(btnId);
    if (btn) btn.disabled = digits.length < 6;
    if (digits.length === 6 && onComplete) onComplete();
  });

  realInput.addEventListener('focus', () => render(realInput.value.replace(/\D/g,'').slice(0,6), true));
  realInput.addEventListener('blur',  () => render(realInput.value.replace(/\D/g,'').slice(0,6), false));

  // 點假格也聚焦真 input
  document.getElementById(cellsId).addEventListener('click', () => realInput.focus());

  // 對外提供清空與標錯方法
  realInput._otpClear = () => {
    realInput.value = '';
    render('', false);
    const btn = document.getElementById(btnId);
    if (btn) btn.disabled = true;
  };
  realInput._otpShakeErr = () => {
    cells.forEach(c => { c.classList.add('err'); setTimeout(() => c.classList.remove('err'), 400); });
  };
}

// 初始化登入驗證碼
setupOtpInput('code-real-input', 'code-cells', 'btn-verify', null);

// Enter 鍵送出
document.getElementById('code-real-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') verifyToken();
});

async function verifyToken() {
  const { db, doc, getDoc, setDoc, Timestamp } = window._fb;
  const code = document.getElementById('code-real-input').value.replace(/\D/g,'');
  const errEl = document.getElementById('guest-err');
  errEl.textContent = '';
  document.getElementById('btn-verify').disabled = true;
  document.getElementById('btn-verify').textContent = '驗證中…';
  try {
    const td = await getDoc(doc(db,'tokens',code));
    if (!td.exists()) throw new Error('驗證碼不存在');
    const raw = td.data();
    // 相容毫秒數（A/B/C 新格式）或 Firestore Timestamp（舊格式）
    const expiresAtMs = typeof raw.expiresAt === 'number'
      ? raw.expiresAt
      : (raw.expiresAt?.toMillis?.() ?? 0);
    if (expiresAtMs < Date.now()) throw new Error('驗證碼已過期');
    const ownerUid = raw.ownerUid || raw.createdBy;
    if (!ownerUid) throw new Error('驗證碼格式錯誤（缺少 ownerUid）');
    // 統一格式：expiresAt 存毫秒數
    await setDoc(doc(db,'guest_access',window._me.uid), { ownerUid, grantedAt: Timestamp.now(), expiresAt: expiresAtMs });
    // 刪除已使用的驗證碼（即刪即用）
    try { await window._fb.deleteDoc(doc(db,'tokens',code)); } catch(_) {}
    window._fbOwnerUid = ownerUid;
    window._fbStartGuestWatch && window._fbStartGuestWatch(window._me.uid);
    window.enterApp('guest');
  } catch(e) {
    errEl.textContent = e.message;
    document.getElementById('code-real-input')._otpShakeErr?.();
    document.getElementById('btn-verify').disabled = false;
    document.getElementById('btn-verify').textContent = '驗 證 進 入';
  }
}

function toggleOwnerLogin() {
  const fields = document.getElementById('owner-fields');
  const toggle = document.getElementById('owner-toggle');
  if (fields.style.display === 'none') {

  } else {

    toggle.textContent = 'Owner 登入 ▾';

}

async function ownerLogin() {
  const email = document.getElementById('owner-email').value.trim();
  const password = document.getElementById('owner-password').value;
  const errEl = document.getElementById('owner-err');

  const btn = document.getElementById('btn-owner-login');
  btn.disabled = true; btn.textContent = '登入中…';
  try {
    await window._fbSignInOwner(email, password);
    // onAuthStateChanged 會接手，自動呼叫 enterApp('trusted')
  } catch(e) {
    errEl.textContent = e.message.replace('Firebase: ', '').replace(/ \(auth\/.*\)\.?/, '');
    btn.disabled = false; btn.textContent = 'Owner 登 入';
  }
}

window.enterApp = function(role) {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-guest').style.display = 'none';
  document.getElementById('screen-app').style.display = '';
  document.getElementById('screen-mobile').style.display = '';
  window._role = role;
  // PC badges
  const b = document.getElementById('role-badge');
  if (b) {
    if (role === 'trusted') {
      b.textContent='✦ Owner'; b.className='role-badge trusted';
      document.getElementById('status-txt').textContent='信任裝置 · 完整存取';
      // 自動清除過期訪客紀錄
      purgeExpiredGuests();
      // Show key button for trusted
      document.getElementById('cal-new-row').style.display='flex';
      document.getElementById('btn-gen').style.display='flex';
      document.getElementById('backup-row').style.display='block';
    } else {
      b.textContent='◈ 訪客模式'; b.className='role-badge guest';
      b.title='點擊登出'; b.style.cursor='pointer';
      b.onclick = async function() {
        if(!confirm('確定要登出訪客模式？')) return;
        const {db, doc, deleteDoc} = window._fb;
        try { await deleteDoc(doc(db,'guest_access',window._me.uid)); } catch(_) {}
        window._showGuestScreen();
      };
      document.getElementById('status-txt').textContent='訪客模式 · 限時存取';
      document.getElementById('backup-row').style.display='block';
      if(!stealthOn){setStealth(true,false);}
    }
  }
  // Mobile badges
  const mb = document.getElementById('mob-badge');
  if (mb) mb.textContent = role === 'trusted' ? '✦ Owner' : '◈ 訪客模式';
  const mobRevoke = document.getElementById('mob-btn-revoke');
  if (mobRevoke) mobRevoke.style.display = role === 'trusted' ? '' : 'none';
  const mobToken = document.getElementById('mob-btn-token');
  if (mobToken) mobToken.style.display = role === 'trusted' ? '' : 'none';
  loadEntries();
};

/* 切換回驗證碼畫面（訪客登出 / 被踢出時使用） */
window._showGuestScreen = function() {
  // 隱藏 app 畫面
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('screen-mobile').style.display = 'none';
  // 清空驗證碼輸入
  document.getElementById('code-real-input')._otpClear?.();

  document.getElementById('btn-verify').textContent = '驗 證 進 入';
  document.getElementById('guest-err').textContent = '';

  document.getElementById('screen-guest').style.display = 'flex';

  document.querySelectorAll('.display-uid').forEach(el => el.textContent = window._me?.uid || '—');

/* ═══════════════════════ DATA ═══════════════════════ */
async function loadEntries() {
  loadStealthPref();   // 不等它：設定讀取卡住不可以擋住日記載入
  // 訪客：先確認 guest_access 仍有效，否則 reload
  if (window._role === 'guest') {
    try {
      const { db, doc, getDoc } = window._fb;
      const gd = await getDoc(doc(db, 'guest_access', window._me.uid));
      if (!gd.exists()) { location.reload(); return; }
      const rawExp = gd.data().expiresAt;
      const expiresAtMs = typeof rawExp === 'number' ? rawExp : (rawExp?.toMillis?.() ?? 0);
      if (expiresAtMs <= Date.now()) { location.reload(); return; }
    } catch(_) {}
  }
  const { db, collection, query, orderBy, getDocs } = window._fb;
  try {
    setSyncState('syncing');
    const q = query(collection(db,'SanctuaryOfReed'), orderBy('createdAt','desc'));
    const snap = await Promise.race([getDocs(q), new Promise((_, rej) => setTimeout(() => rej(new Error('讀取逾時')), 15000))]);
    const wasEmpty = entries.length === 0;
    entries = snap.docs.map(d=>({id:d.id,...d.data()}));
    // 負能量功能已移除：非訪客身分時順手清掉舊的負能量紀錄
    const oldNeg = entries.filter(e=>e.mood==='negative');
    if (oldNeg.length) {
      entries = entries.filter(e=>e.mood!=='negative');
      if (window._role !== 'guest') oldNeg.forEach(e=>window._fb.deleteDoc(window._fb.doc(db,'SanctuaryOfReed',e.id)).catch(()=>{}));
    }
    setSyncState('idle');
    entriesLoaded = true; clearTimeout(loadRetryTimer);
    renderCalendar(); renderMobCalendar();
    // On first load, auto-open today on PC
    if (wasEmpty) {
      const t = new Date();
      openDay(t.getFullYear(), t.getMonth(), t.getDate());
    }
  } catch(e) { setSyncState('error'); console.warn(e); showLoadError(e); }
}

/* ═══════════════════════ CALENDAR HELPERS ═══════════════════════ */
// key "y-m-d" → {zh: 中文字數, en: 英文單字數}
function getDayMarks() {
  const map = new Map();
  entries.forEach(e => {
    const t = e.createdAt?.toDate ? e.createdAt.toDate() : null; if (!t) return;
    const key = `${t.getFullYear()}-${t.getMonth()}-${t.getDate()}`;
    const r = map.get(key) || { zh: 0, en: 0 };
    if (e.mood === 'english') r.en += (e.body||'').trim().split(/\s+/).filter(Boolean).length;
    else r.zh += (e.body||'').replace(/\s/g,'').length;
    map.set(key, r);
  });
  return map;
}
function markDay(el, r) {
  if (!r) return;
  if (r.zh) el.classList.add('has-entry');   // 金色底線 = 有中文
  if (r.en) el.classList.add('has-en');      // 綠色底線 = 有英文
}

/* ═══════════════════════ PC CALENDAR ═══════════════════════ */
function renderCalendar() {
  const months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('cal-month-label').textContent = `${calYear} · ${months[calMonth]}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  ['日','一','二','三','四','五','六'].forEach(label => {
    const h = document.createElement('div'); h.className = 'cal-dow'; h.textContent = label; grid.appendChild(h);
  });
  const today = new Date();
  const dates = getDayMarks();
  const first = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  for (let i=0;i<first;i++) { const x=document.createElement('div'); x.className='cal-day'; grid.appendChild(x); }
  for (let day=1; day<=daysInMonth; day++) {
    const el = document.createElement('div'); el.className='cal-day'; el.textContent=day;
    const key = `${calYear}-${calMonth}-${day}`;
    markDay(el, dates.get(key));
    if (today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===day) el.classList.add('today');
    if (selectedDate && selectedDate.y===calYear && selectedDate.m===calMonth && selectedDate.d===day) el.classList.add('selected');
    // Hover tooltip
    el.addEventListener('mouseenter', ev => showTooltip(ev, calYear, calMonth, day));
    el.addEventListener('mousemove', ev => moveTooltip(ev));
    el.addEventListener('mouseleave', hideTooltip);
    el.onclick = () => openDay(calYear, calMonth, day);
    grid.appendChild(el);
  }
}
function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }

/* ═══════════════════════ TOOLTIP ═══════════════════════ */
function showTooltip(ev, y, m, d) {
  const r = getDayMarks().get(`${y}-${m}-${d}`); if (!r) return;
  const tt = document.getElementById('cal-tooltip');
  tt.innerHTML = (r.zh && !enOnly ? `<span class="tt-pos">中文 ${r.zh} 字</span>` : '') + (r.zh && !enOnly && r.en ? '<br>' : '') + (r.en ? `<span class="tt-neg">EN ${r.en} words</span>` : '');
  moveTooltip(ev);
  tt.classList.add('show');
}
function moveTooltip(ev) {
  const tt = document.getElementById('cal-tooltip');
  const ttW = tt.offsetWidth || 120, ttH = tt.offsetHeight || 50;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + ttW + 4 > window.innerWidth) x = ev.clientX - ttW - 6;
  if (y + ttH + 4 > window.innerHeight) y = ev.clientY - ttH - 6;
  if (x < 4) x = 4;
  if (y < 4) y = 4;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}
function hideTooltip() { document.getElementById('cal-tooltip').classList.remove('show'); }

/* ████ 模式：狀態存在雲端（SanctuaryOfReed/_settings），無痕視窗或換裝置都會跟著走。
   預設為開啟（fail-safe）：登入後讀到雲端設定為「關」才會關閉，讀取失敗或離線時維持開啟，避免內容被看到。
   _settings 沒有 createdAt，不會出現在日記查詢與備份匯出裡。 */
function setStealth(on, persist = true) {
  stealthOn = on;
  document.body.classList.toggle('stealth', on);
  const b = document.getElementById('stealth-btn'); if (b) b.classList.toggle('active', on);
  if (persist && window._role === 'trusted') saveSettingCloud({ stealth: on });
}
async function saveSettingCloud(obj) {
  try {
    const { db, doc, setDoc } = window._fb;
    await setDoc(doc(db, 'SanctuaryOfReed', '_settings'), obj, { merge: true });
  } catch (e) { console.warn(e); showToast('設定無法同步到雲端，僅本次有效'); }
}
let stealthLoaded = false;
async function loadStealthPref() {
  if (stealthLoaded || window._role !== 'trusted') return;
  try {
    const { db, doc, getDoc } = window._fb;
    const snap = await Promise.race([getDoc(doc(db, 'SanctuaryOfReed', '_settings')), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]);
    stealthLoaded = true;
    const d = snap.exists() ? snap.data() : null;
    if (d && d.stealth === false) setStealth(false, false);
    if (!d || d.enOnly !== true) setEnOnly(false, false);   // 只有雲端明確記錄「只看英文」才維持隱藏中文
  } catch (e) { console.warn(e); /* 讀取失敗：維持開啟 */ }
}
function toggleStealth() { setStealth(!stealthOn); }
setStealth(true, false);   // 載入雲端設定前先保持開啟
document.addEventListener('keydown', e => {
  if (e.ctrlKey&&e.shiftKey&&e.key==='H'){e.preventDefault();toggleStealth();}
  if (e.altKey&&!e.ctrlKey&&!e.metaKey&&e.code==='KeyX'){e.preventDefault();toggleEnOnly();}
});

/* ═══════════════════════ TOKEN MODAL ═══════════════════════ */
function openModal(){document.getElementById('modal').classList.add('open');}
function resetTokenView(){const n=document.getElementById('token-num');n.textContent='000000';n.classList.add('empty');document.getElementById('token-tim').textContent='點擊下方按鈕產生';}
function closeModal(){document.getElementById('modal').classList.remove('open');clearInterval(timerInt);resetTokenView();}
function setDur(btn){document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');durMin=parseInt(btn.dataset.min);}
async function generateToken(){
  const{db,doc,setDoc,Timestamp}=window._fb;
  clearInterval(timerInt);
  const code=String(Math.floor(100000+Math.random()*900000));
  const expiresAt=Date.now()+durMin*60000;  // 統一格式：毫秒數
  try{
    await setDoc(doc(db,'tokens',code),{ownerUid:window._me.uid,expiresAt});
    const tn=document.getElementById('token-num'); tn.textContent=code; tn.classList.remove('empty');
    let rem=durMin*60;
    const tick=()=>{
      const m=Math.floor(rem/60),s=rem%60;
      document.getElementById('token-tim').innerHTML=`有效時間剩餘 <span>${m}:${String(s).padStart(2,'0')}</span>`;
      if(rem<=0){clearInterval(timerInt);resetTokenView();document.getElementById('token-tim').textContent='已過期';}
      rem--;
    };
    tick(); timerInt=setInterval(tick,1000);
  } catch(e){showToast('產生失敗：'+e.message);}
}

/* ═══════════════════════ BACKUP EXPORT ═══════════════════════ */
let backupLongPressTimer = null;

function openBackupModal() {
  document.getElementById('backup-modal').classList.add('open');
  document.getElementById('backup-err').textContent = '';
  document.getElementById('btn-backup-verify').disabled = true;
  setupBackupCodeInputs();
}
function closeBackupModal() {
  document.getElementById('backup-modal').classList.remove('open');
  document.getElementById('backup-real-input')._otpClear?.();
}

function setupBackupCodeInputs() {
  // ⚠️ 同登入區：單一隱藏 input + 視覺假格，請勿改回多 input（見上方架構說明）
  setupOtpInput('backup-real-input', 'backup-code-cells', 'btn-backup-verify', null);
  document.getElementById('backup-real-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') verifyAndExport();
  });
}

async function verifyAndExport() {
  const { db, doc, getDoc } = window._fb;
  const code = document.getElementById('backup-real-input').value.replace(/\D/g,'');
  const errEl = document.getElementById('backup-err');
  errEl.textContent = '';
  document.getElementById('btn-backup-verify').disabled = true;
  document.getElementById('btn-backup-verify').textContent = '驗證中…';
  try {
    const td = await getDoc(doc(db,'tokens',code));
    if (!td.exists()) throw new Error('驗證碼不存在');
    const rawExp = td.data().expiresAt;
    const expiresAtMs = typeof rawExp === 'number' ? rawExp : (rawExp?.toMillis?.() ?? 0);
    if (expiresAtMs < Date.now()) throw new Error('驗證碼已過期');
    // Export
    const exportData = entries.map(e => {
      const dt = e.createdAt?.toDate ? e.createdAt.toDate() : null;
      return { id: e.id, date: dt ? dt.toISOString() : null, mood: e.mood || '', body: e.body || '' };
    });
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    a.href = url;
    a.download = `sanctuary_backup_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.json`;
    a.click();
    URL.revokeObjectURL(url);
    // Save history
    saveBackupHistory(now);
    closeBackupModal();
    showToast('匯出成功 ✦');
  } catch(e) {
    errEl.textContent = e.message;
    document.getElementById('backup-real-input')._otpShakeErr?.();
    document.getElementById('btn-backup-verify').disabled = false;
    document.getElementById('btn-backup-verify').textContent = '確 認 匯 出';
  }
}

function saveBackupHistory(date) {
  try {
    const key = 'backup_history';
    const hist = JSON.parse(localStorage.getItem(key) || '[]');
    hist.unshift(date.toISOString());
    localStorage.setItem(key, JSON.stringify(hist.slice(0, 5)));
  } catch(_) {}
}

function getBackupHistory() {
  try {
    return JSON.parse(localStorage.getItem('backup_history') || '[]');
  } catch(_) { return []; }
}

function startBackupLongPress(e) {
  cancelBackupLongPress();
  backupLongPressTimer = setTimeout(() => {
    showBackupHistory(e);
  }, 600);
}
function cancelBackupLongPress() {
  if (backupLongPressTimer) { clearTimeout(backupLongPressTimer); backupLongPressTimer = null; }
  // Hide popup after short delay
  setTimeout(hideBackupHistory, 2500);
}
function showBackupHistory(e) {
  const hist = getBackupHistory();
  const pop = document.getElementById('backup-history-pop');
  if (!hist.length) { pop.innerHTML = '尚無匯出記錄'; }
  else {
    pop.innerHTML = hist.map(iso => {
      const d = new Date(iso);
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }).join('<br>');
  }
  const rect = document.getElementById('btn-backup').getBoundingClientRect();
  pop.style.left = rect.left + 'px';
  pop.style.top = (rect.top - pop.offsetHeight - 8) + 'px';
  pop.classList.add('show');
  // Position after render
  requestAnimationFrame(() => {
    pop.style.left = rect.left + 'px';
    pop.style.top = (rect.top - pop.offsetHeight - 8) + 'px';
  });
}
function hideBackupHistory() {
  document.getElementById('backup-history-pop').classList.remove('show');
}
document.addEventListener('mouseup', () => { cancelBackupLongPress(); hideBackupHistory(); });
document.addEventListener('touchend', () => { cancelBackupLongPress(); });

/* ═══════════════════════ DAY EDITOR（桌機 / 手機共用，左中文右英文）═══════════════════════
   資料模型不變：每天最多兩筆 → mood:'positive'（中文）、mood:'english'（英文）。
   儲存策略：打字 1.5 秒後自動存、離開欄位/切換日期/離開頁面前會先存；
   「儲存」鈕保留作為手動補存。任何一次存檔失敗都會在畫面上標示，並每 8 秒自動重試。 */
const VIEWS = {
  pc:  { pos:'cmp-text-pos',       en:'cmp-text-en',       date:'entry-date',     state:'save-state',     del:'btn-del' },
  mob: { pos:'mob-split-pos-text', en:'mob-split-en-text', date:'mob-entry-date', state:'mob-save-state', del:'mob-btn-del' },
};
const $id = id => document.getElementById(id);
let curDay = null, activeView = 'pc', dirty = false, saveTimer = null, saveChain = Promise.resolve(true);
const SAVE_TXT = { saved:'已儲存', dirty:'尚未儲存…', saving:'儲存中…', loading:'載入中…', error:'⚠ 儲存失敗，請按「儲存」重試', loaderr:'⚠ 資料讀取失敗，自動重試中（暫時無法輸入）' };
let entriesLoaded = false, loadRetryTimer = null;
// 日記還沒載入完成前鎖住文字框，避免「打了字卻沒有對應的日期可存」而默默遺失
function setEditable(on) { Object.values(VIEWS).forEach(v => [v.pos, v.en].forEach(id => { $id(id).readOnly = !on; })); }
function showLoadError(e) {
  setSaveState('loaderr', e && (e.code || e.message));
  clearTimeout(loadRetryTimer); loadRetryTimer = setTimeout(loadEntries, 5000);
}

function setSaveState(st, detail) {
  const bad = st === 'error' || st === 'loaderr';
  Object.values(VIEWS).forEach(v => { const el = $id(v.state); if (el) { el.textContent = SAVE_TXT[st] + (bad && detail ? ` [${detail}]` : ''); el.dataset.s = bad ? 'error' : st; } });
  setSyncState(st === 'saving' ? 'syncing' : bad ? 'error' : 'idle');
}
function dayKeyOf(e) { const t = e.createdAt?.toDate ? e.createdAt.toDate() : null; return t && `${t.getFullYear()}-${t.getMonth()}-${t.getDate()}`; }
function updateWordCount() {
  const v = VIEWS[activeView], zh = $id(v.pos).value.replace(/\s/g,'').length, en = $id(v.en).value.trim().split(/\s+/).filter(Boolean).length;
  const w = $id('wordcount'); if (w) w.textContent = enOnly ? `EN ${en} words` : `中文 ${zh} 字 · EN ${en} words`;
}
function refreshDayUI() {
  const has = !!(curDay && (curDay.posId || curDay.enId));
  Object.values(VIEWS).forEach(v => { const b = $id(v.del); if (b) b.style.display = has ? '' : 'none'; });
  renderCalendar(); renderMobCalendar(); updateWordCount();
}

async function openDay(y, m, d, showMob) {
  if (!entriesLoaded) return;   // 資料沒載入成功前不開日期，避免對沒讀到的日記重複新增
  if (curDay && !(curDay.y === y && curDay.m === m && curDay.d === d)) {
    const ok = await flushSave();
    if (!ok && !confirm('目前這一天還沒儲存成功，仍要切換嗎？（未儲存的內容會遺失）')) return;
  }
  const key = `${y}-${m}-${d}`, de = entries.filter(e => dayKeyOf(e) === key);
  const pos = de.find(e => e.mood === 'positive'), en = de.find(e => e.mood === 'english');
  curDay = { y, m, d, posId: pos?.id || null, enId: en?.id || null };
  selectedDate = { y, m, d };
  const dateStr = new Date(y, m, d).toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  Object.values(VIEWS).forEach(v => { $id(v.date).textContent = dateStr; $id(v.pos).value = pos?.body || ''; $id(v.en).value = en?.body || ''; });
  dirty = false; clearTimeout(saveTimer); setEditable(true); setSaveState('saved'); refreshDayUI();
  if (showMob) { $id('mob-home').style.display = 'none'; $id('mob-editor').style.display = 'flex'; }
  setTimeout(() => $id(VIEWS[showMob ? 'mob' : 'pc'].pos).focus(), 100);
}
function openToday() {
  const t = new Date(); mobCalYear = t.getFullYear(); mobCalMonth = t.getMonth();
  openDay(t.getFullYear(), t.getMonth(), t.getDate(), true);
}
let mobSelectedDate = null;

function markDirty() {
  dirty = true; setSaveState('dirty'); updateWordCount();
  clearTimeout(saveTimer); saveTimer = setTimeout(() => saveDay(false), 1500);
}
Object.entries(VIEWS).forEach(([k, v]) => [v.pos, v.en].forEach(id => {
  const ta = $id(id);
  ta.addEventListener('input', () => { activeView = k; markDirty(); });
  ta.addEventListener('blur', () => { if (dirty) saveDay(false); });
}));

function saveDay(manual) {
  clearTimeout(saveTimer);
  const day = curDay; if (!day) return Promise.resolve(true);
  const v = VIEWS[activeView], pos = $id(v.pos).value.trim(), en = $id(v.en).value.trim();
  const run = () => doSave(day, pos, en, manual);
  return (saveChain = saveChain.then(run, run));
}
function flushSave() { return dirty ? saveDay(false) : saveChain; }

async function doSave(day, pos, en, manual) {
  if (!dirty && !manual) return true;
  const { db, doc, setDoc, deleteDoc, Timestamp } = window._fb, COL = 'SanctuaryOfReed';
  const jobs = [['posId','positive',pos,0,'中文日記'], ['enId','english',en,2,'英文日記']];
  if (manual) {
    const gone = jobs.filter(j => day[j[0]] && !j[2]).map(j => j[4]);
    if (gone.length && !confirm('以下欄位已清空，儲存將永久刪除：\n\n・' + gone.join('\n・') + '\n\n確定要繼續嗎？')) return false;
  }
  if (day === curDay) setSaveState('saving');
  try {
    await Promise.race([
      Promise.all(jobs.map(async ([key, mood, body, min]) => {
        if (body) {
          const isNew = !day[key];
          if (isNew) day[key] = doc(window._fb.collection(db, COL)).id;   // 先決定 id，逾時重試也不會重複新增
          const data = { body, mood };
          if (isNew) data.createdAt = Timestamp.fromDate(new Date(day.y, day.m, day.d, 12, min, 0));
          await setDoc(doc(db, COL, day[key]), data, { merge: true });
          const e = entries.find(x => x.id === day[key]);
          if (e) e.body = body; else entries.push({ id: day[key], ...data, createdAt: data.createdAt || Timestamp.fromDate(new Date(day.y, day.m, day.d, 12, min, 0)) });
        } else if (day[key] && manual) {
          const id = day[key]; await deleteDoc(doc(db, COL, id));
          entries = entries.filter(x => x.id !== id); day[key] = null;
        }
      })),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000)),
    ]);
    if (day === curDay) {
      const v = VIEWS[activeView];
      if ($id(v.pos).value.trim() === pos && $id(v.en).value.trim() === en) { dirty = false; setSaveState('saved'); }
      else markDirty();
      refreshDayUI();
    }
    if (manual) showToast('已儲存 ✦');
    return true;
  } catch (err) {
    console.warn('save failed', err);
    if (day === curDay) { setSaveState('error', err.code || err.message); clearTimeout(saveTimer); saveTimer = setTimeout(() => saveDay(false), 8000); }
    if (manual) showToast('儲存失敗');
    return false;
  }
}

async function delDay() {
  if (!curDay || !(curDay.posId || curDay.enId)) return;
  if (!confirm('確定要刪除這一天的中文與英文日記嗎？此動作無法復原。')) return;
  clearTimeout(saveTimer); await saveChain;
  const { db, doc, deleteDoc } = window._fb, ids = [curDay.posId, curDay.enId].filter(Boolean);
  try {
    await Promise.all(ids.map(id => deleteDoc(doc(db, 'SanctuaryOfReed', id))));
    entries = entries.filter(e => !ids.includes(e.id)); curDay.posId = curDay.enId = null;
    Object.values(VIEWS).forEach(v => { $id(v.pos).value = ''; $id(v.en).value = ''; });
    dirty = false; setSaveState('saved'); refreshDayUI(); showToast('已刪除');
  } catch (e) { showToast('刪除失敗'); }
}

async function mobBack() {
  const ok = await flushSave();
  if (!ok && !confirm('這一天還沒儲存成功，仍要離開嗎？（未儲存的內容會遺失）')) return;
  $id('mob-editor').style.display = 'none'; $id('mob-home').style.display = 'flex'; renderMobCalendar();
}
/* ═══ 只看英文模式：整欄隱藏中文（非模糊）；狀態存雲端，預設隱藏直到讀到雲端設定 ═══ */
let enOnly = true;
const _eye = d => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const EYE_OPEN = _eye('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>');
const EYE_CLOSED = _eye('<path d="M3 10c2.2 3.6 5.4 5.5 9 5.5s6.8-1.9 9-5.5"/><path d="M5.5 14.2L4 16.5M9.5 16l-.8 2.6M14.5 16l.8 2.6M18.5 14.2l1.5 2.3"/>');
function setEnOnly(on, persist = true) {
  enOnly = on;
  document.body.classList.toggle('en-only', on);
  ['en-only-btn', 'mob-en-only-btn'].forEach(id => {
    const b = $id(id); if (!b) return;
    b.innerHTML = on ? EYE_CLOSED : EYE_OPEN;                       // 閉眼＝中文已隱藏，睜眼＝中文顯示中
    b.title = b.ariaLabel = (on ? '顯示中文' : '隱藏中文') + '（Alt+X）';
  });
  if (on && curDay) $id(VIEWS[activeView].en).focus();
  updateWordCount(); renderCalendar(); renderMobCalendar();
  if (persist && window._role === 'trusted') saveSettingCloud({ enOnly: on });
}
function toggleEnOnly() { setEnOnly(!enOnly); }
setEnOnly(true, false);

/* ═══════════════════════ TTS ENGINE（共用工廠，桌面 / 手機共用同一份邏輯）═══════════════════════
   原本桌面版 (tts*) 與手機版 (mobTts* / mobSplitTts*) 是兩份幾乎一模一樣的程式碼，
   現在改用 createTtsEngine() 產生兩個獨立 instance，差異只在 DOM id / localStorage key，
   往後修 bug 或加功能只需要改這一份工廠函式即可。
═══════════════════════════════════════════════════════════════════════════════════ */
function createTtsEngine(cfg) {
  const state = { playing: false, pref: { voiceURI: '', rate: 1.0 } };

  const $ = (id) => document.getElementById(id);

  function loadPref() {
    try {
      const saved = localStorage.getItem(cfg.storageKey);
      if (saved) state.pref = { ...state.pref, ...JSON.parse(saved) };
      state.pref.rate = Math.min(1.3, Math.max(0.2, parseFloat(state.pref.rate) || 1));
    } catch(_) {}
  }
  function savePref() {
    const sel = $(cfg.voiceSelectId);
    const spd = $(cfg.speedInputId);
    state.pref.voiceURI = sel ? sel.value : '';
    state.pref.rate = spd ? parseFloat(spd.value) : 1.0;
    try { localStorage.setItem(cfg.storageKey, JSON.stringify(state.pref)); } catch(_) {}
  }
  function populateVoices() {
    const voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    const sel = $(cfg.voiceSelectId);
    if (!sel) return;
    sel.innerHTML = '';
    if (!voices.length) {
      const opt = document.createElement('option');
      opt.value = ''; opt.textContent = '（無可用英文聲線）';
      sel.appendChild(opt);
      return;
    }
    voices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = v.name + ' (' + v.lang + ')';
      sel.appendChild(opt);
    });
    if (state.pref.voiceURI) {
      const match = [...sel.options].find(o => o.value === state.pref.voiceURI);
      if (match) sel.value = state.pref.voiceURI;
    }
    const spd = $(cfg.speedInputId);
    if (spd) { spd.value = state.pref.rate; $(cfg.speedValId).textContent = parseFloat(state.pref.rate).toFixed(1) + '×'; }
  }
  function speedChange(el) {
    $(cfg.speedValId).textContent = parseFloat(el.value).toFixed(1) + '×';
    state.pref.rate = parseFloat(el.value);
    savePref();
    if (state.playing) { stop(); play(); }
  }
  function toggleSettings() {
    const panel = $(cfg.settingsPanelId);
    const btn   = $(cfg.settingsBtnId);
    if (!panel) return;
    const isOpen = panel.classList.contains('open');
    panel.classList.toggle('open', !isOpen);
    btn && btn.classList.toggle('settings-open', !isOpen);
    if (!isOpen) populateVoices();
  }
  function getVoice() {
    const all = window.speechSynthesis.getVoices();
    if (state.pref.voiceURI) {
      const match = all.find(v => v.voiceURI === state.pref.voiceURI);
      if (match) return match;
    }
    return all.find(v => v.lang.startsWith('en')) || null;
  }
  function setBtnState(playing) {
    const btn = $(cfg.playBtnId);
    if (!btn) return;
    btn.textContent = playing ? '⏸' : '▶';
    btn.classList.toggle('playing', playing);
  }
  // 有選取文字 → 從選取處開始念到結尾（選在單字中間會退到字首）；沒有選取 → 從頭念
  function startIndex(ta) {
    const a = ta.selectionStart, b = ta.selectionEnd;
    if (a == null || a === b) return 0;
    let i = a; while (i > 0 && /\S/.test(ta.value[i - 1])) i--;
    return i;
  }
  function play() {
    const ta = $(cfg.textSourceId) || { value: '' };
    const from = startIndex(ta), text = (ta.value || '').slice(from);
    if (!text.trim()) { showToast('請先貼上英文翻譯'); return; }
    state.fromIdx = from;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.voice = getVoice();
    utt.rate  = state.pref.rate || 1.0;
    utt.lang  = 'en';
    utt.onstart = () => { state.playing = true; setBtnState(true); };
    utt.onend = utt.onerror = () => { state.playing = false; setBtnState(false); };
    window.speechSynthesis.speak(utt);
  }
  function pauseResume() {
    if (!window.speechSynthesis.speaking) return;
    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
      state.playing = true;
      setBtnState(true);
    } else {
      window.speechSynthesis.pause();
      state.playing = false;
      setBtnState(false);
    }
  }
  function toggle() {
    if (!window.speechSynthesis) { showToast('此瀏覽器不支援 TTS'); return; }
    if (state.playing) pauseResume();
    else if (window.speechSynthesis.paused) {
      // 暫停中：若又選了新的位置就從新位置重播，否則接續播放
      const ta = $(cfg.textSourceId);
      if (ta && ta.selectionStart !== ta.selectionEnd && startIndex(ta) !== state.fromIdx) play();
      else pauseResume();
    } else play();
  }
  function stop() {
    window.speechSynthesis.cancel();
    state.playing = false;
    setBtnState(false);
  }

  // 點外部關閉設定面板
  document.addEventListener('click', (e) => {
    const panel = $(cfg.settingsPanelId);
    const btn   = $(cfg.settingsBtnId);
    if (!panel || !panel.classList.contains('open')) return;
    if (!panel.contains(e.target) && !(e.target.closest && e.target.closest('#' + cfg.playBtnId))) {
      panel.classList.remove('open');
      btn && btn.classList.remove('settings-open');
    }
  });

  // 播放鍵手勢：電腦右鍵、手機長按 → 開啟設定；一般點擊 → 播放／暫停
  function bindPlayGestures() {
    const btn = $(cfg.playBtnId); if (!btn) return;
    let timer = null, fired = false;
    const open = () => {
      const p = $(cfg.settingsPanelId);
      if (p && !p.classList.contains('open')) { p.classList.add('open'); populateVoices(); }
    };
    const cancel = () => clearTimeout(timer);
    btn.addEventListener('mousedown', (e) => e.preventDefault());   // 按播放鍵不搶走文字框焦點，選取範圍保持不變
    btn.addEventListener('contextmenu', (e) => { e.preventDefault(); open(); });
    btn.addEventListener('touchstart', () => { fired = false; timer = setTimeout(() => { fired = true; open(); }, 500); }, { passive: true });
    ['touchend', 'touchmove', 'touchcancel'].forEach(t => btn.addEventListener(t, cancel));
    btn.addEventListener('click', () => { if (fired) { fired = false; return; } toggle(); });
  }

  loadPref();
  bindPlayGestures();
  return { populateVoices, speedChange, toggleSettings, play, stop, toggle, savePref };
}

// 桌面版（比較檢視中的英文欄）
const ttsEngine = createTtsEngine({
  storageKey: 'tts_pref',
  voiceSelectId: 'tts-voice-select',
  speedInputId: 'tts-speed',
  speedValId: 'tts-speed-val',
  settingsPanelId: 'tts-settings-panel',
  settingsBtnId: 'en-tts-settings-btn',
  playBtnId: 'en-tts-play',
  textSourceId: 'cmp-text-en',
});
// 手機版（雙欄對照中的英文欄）
const mobTtsEngine = createTtsEngine({
  storageKey: 'mob_tts_pref',
  voiceSelectId: 'mob-tts-voice-select',
  speedInputId: 'mob-tts-speed',
  speedValId: 'mob-tts-speed-val',
  settingsPanelId: 'mob-tts-settings-panel',
  settingsBtnId: 'mob-split-tts-settings-btn',
  playBtnId: 'mob-split-tts-play',
  textSourceId: 'mob-split-en-text',
});

// 沿用原本的全域函式名稱，相容 HTML 內的 onclick="..."
function ttsToggleSettings() { ttsEngine.toggleSettings(); }
function ttsSpeedChange(el)  { ttsEngine.speedChange(el); }
function ttsToggle()         { ttsEngine.toggle(); }
function ttsStop()           { ttsEngine.stop(); }
function ttsSavePref()       { ttsEngine.savePref(); }

function mobSplitTtsToggleSettings() { mobTtsEngine.toggleSettings(); }
function mobTtsSpeedChange(el)       { mobTtsEngine.speedChange(el); }
function mobSplitTtsToggle()         { mobTtsEngine.toggle(); }
function mobSplitTtsStop()           { mobTtsEngine.stop(); }
function mobTtsSavePref()            { mobTtsEngine.savePref(); }

// 初始化聲線清單（聲線是非同步載入的，瀏覽器準備好才會觸發 onvoiceschanged）
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => { ttsEngine.populateVoices(); mobTtsEngine.populateVoices(); };
  ttsEngine.populateVoices();
  mobTtsEngine.populateVoices();
}

/* ═══════════════════════ PURGE EXPIRED GUESTS ═══════════════════════ */
async function purgeExpiredGuests(){
  const{db,collection,getDocs,doc,deleteDoc}=window._fb;
  try{
    const snap=await getDocs(collection(db,'guest_access'));
    if(snap.empty) return;
    const now=Date.now();
    const expired=snap.docs.filter(d=>{
      const raw=d.data().expiresAt;
      const ms=typeof raw==='number'?raw:(raw?.toMillis?.()??0);
      return ms<=now;
    });
    if(!expired.length) return;
    await Promise.all(expired.map(d=>deleteDoc(doc(db,'guest_access',d.id)).catch(()=>{})));
    console.log('[SanctuaryOfReed] 已清除 '+expired.length+' 筆過期訪客紀錄');
  }catch(_){}
}

/* ═══════════════════════ REVOKE GUESTS ═══════════════════════ */
async function revokeAllGuests(){
  if(!confirm('確定要強制登出所有訪客？他們目前的訪問權限將立即失效。'))return;
  const{db,collection,getDocs,doc,deleteDoc,setDoc}=window._fb;
  try{
    const[guestSnap,tokenSnap]=await Promise.all([getDocs(collection(db,'guest_access')),getDocs(collection(db,'tokens'))]);
    const ops=[];
    const expiredMs=Date.now()-1000;
    guestSnap.docs.forEach(d=>{ops.push(deleteDoc(doc(db,'guest_access',d.id)).catch(()=>setDoc(doc(db,'guest_access',d.id),{expiresAt:expiredMs},{merge:true})));});
    tokenSnap.docs.forEach(d=>{ops.push(deleteDoc(doc(db,'tokens',d.id)).catch(()=>{}));});
    await Promise.all(ops);
    showToast(guestSnap.size?'已強制登出 '+guestSnap.size+' 位訪客 ✦':'已清除所有驗證碼 ✦');
  }catch(e){showToast('操作失敗：'+e.message);}
}

/* ═══════════════════════ UTILS ═══════════════════════ */
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

/* ═══════════════════════ PWA: SERVICE WORKER + 自動更新 ═══════════════════════
   每次你重新部署（推上新版 index.html / sw.js）後：
   1. 使用者開啟 App 時，瀏覽器會在背景比對 sw.js 是否有變動。
   2. 新 SW 安裝完成 → 立即 skipWaiting + clients.claim 接管。
   3. 頁面收到 controllerchange 後自動重新整理一次，載入最新內容。
   4. 即使 sw.js 本身沒變，頁面資源也是 network-first 策略，
      只要有網路就一定拿到最新版本，不會被舊快取卡住。
   使用者完全不需要手動清快取或重新安裝。
═══════════════════════════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      // 每次進站都主動檢查一次是否有新版本
      reg.update().catch(() => {});

      // 定期背景檢查（每 30 分鐘），避免長時間開著分頁吃不到更新
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);

      reg.addEventListener('updatefound', () => {
        const installing = reg.installing;
        if (!installing) return;
        installing.addEventListener('statechange', () => {
          if (installing.state === 'installed' && navigator.serviceWorker.controller) {
            // 有新版本已就緒，請它立刻接管（新 sw.js 內也會 skipWaiting）
            installing.postMessage('SKIP_WAITING');
          }
        });
      });
    }).catch((e) => console.warn('[SW] 註冊失敗：', e.message));

    // 新 SW 接管後，重新整理頁面以套用最新版本（只自動重整一次）
    let _swRefreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (_swRefreshed) return;
      _swRefreshed = true;
      window.location.reload();
    });
  });
}
